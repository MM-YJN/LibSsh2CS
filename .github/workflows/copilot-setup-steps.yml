name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot requires this exact job name.
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git line endings
        run: git config --local core.autocrlf input

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client ripgrep

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore packages and repository tools
        run: |
          dotnet restore LibSsh2CS.slnx --locked-mode
          dotnet tool restore

      - name: Verify integration prerequisites
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux
          command -v ssh-agent
          command -v ssh-add
