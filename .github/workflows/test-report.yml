name: Test Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Reports consume artifacts from the triggering CI run. Coverage tooling comes
# from the trusted default-branch revision; never execute code from the tested PR.
permissions:
  contents: read
  actions: read

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted sources for failure details
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Keep OS directories separate so identically named TRX files survive.
      - name: Download Linux results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: linux-test-results
          path: artifacts/test-results/linux

      - name: Download Windows results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: windows-test-results
          path: artifacts/test-results/windows

      - name: Summarize combined tests
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Tests - Linux and Windows
          report-title: Tests - Linux and Windows
          path: 'artifacts/test-results/**/*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'true'
          list-tests: failed

  coverage:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    permissions:
      contents: read
      actions: read
      checks: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted reporting tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download Linux results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: linux-test-results
          path: artifacts/coverage-input/linux

      - name: Download Windows results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: windows-test-results
          path: artifacts/coverage-input/windows

      - name: Generate combined coverage report
        id: coverage
        run: |
          # Require both suites from each OS; never gate partial coverage.
          for platform in linux windows; do
            test "$(find "artifacts/coverage-input/$platform" -maxdepth 1 -name '*.cobertura.*.xml' | wc -l)" -eq 2
          done
          dotnet tool restore
          dotnet reportgenerator \
            '-reports:./artifacts/coverage-input/**/*.cobertura.*.xml' \
            '-targetdir:./artifacts/coverage-combined' \
            '-sourcedirs:./source/LibSsh2CS' \
            '-assemblyfilters:+LibSsh2CS' \
            '-reporttypes:Html;MarkdownSummaryGithub;Cobertura'

      - name: Enforce combined coverage thresholds
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          python3 .github/scripts/check_coverage.py artifacts/coverage-combined \
            --line-threshold 90 --branch-threshold 80

      - name: Publish detailed coverage summary
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: cat artifacts/coverage-combined/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-coverage
          path: artifacts/coverage-combined/
          retention-days: 14
          if-no-files-found: error

      # workflow_run jobs belong to the default branch. Attach the coverage
      # outcome explicitly to the commit tested by CI for PR status checks.
      - name: Publish coverage check
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ job.status }}
        run: |
          jq -n \
            --arg sha "$TESTED_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{name: "Coverage", head_sha: $sha, status: "completed", conclusion: $conclusion,
              details_url: $url, output: {title: "Combined coverage",
              summary: "See Test Report for coverage thresholds, the summary, and the HTML artifact."}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input -
